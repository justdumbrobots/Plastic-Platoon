name: plastic_platoon
description: >
  Plastic Platoon – a top-down army-men IO battle royale.
  Collect plastic scraps to upgrade your weapon, outmanoeuvre rivals,
  and be the last soldier standing on the sandbox battlefield.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
